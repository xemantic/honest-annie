[versions]
# libraries
kotlinTarget = "2.4"
javaTarget = "17"
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
ktor = "3.6.1"
anthropic = "3.8.0"
openai = "4.101.0"
kotlinLogging = "8.0.7"
logback = "1.6.6"
xemanticKotlinIntrospection = "0.1.0"
xemanticKotlinScript = "0.2.1"
xemanticKotlinScriptPython = "0.2.0"
jep = "4.3.2"
xemanticKotlinTest = "1.18.0"
xemanticAiFileMagic = "0.4.0"
asm = "9.10.1"
# plugins
versionCatalogUpdatePlugin = "1.1.2"
xemanticConventionsPlugin = "0.7.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
openai-java = { module = "com.openai:openai-java", version.ref = "openai" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlinLogging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
xemantic-kotlin-introspection = { module = "com.xemantic.kotlin:xemantic-kotlin-introspection", version.ref = "xemanticKotlinIntrospection" }
xemantic-kotlin-script = { module = "com.xemantic.kotlin:xemantic-kotlin-script", version.ref = "xemanticKotlinScript" }
xemantic-kotlin-script-python = { module = "com.xemantic.kotlin:xemantic-kotlin-script-python", version.ref = "xemanticKotlinScriptPython" }
xemantic-ai-file-magic = { module = "com.xemantic.ai:xemantic-ai-file-magic", version.ref = "xemanticAiFileMagic" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
xemantic-kotlin-test = { module = "com.xemantic.kotlin:xemantic-kotlin-test", version.ref = "xemanticKotlinTest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-power-assert = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "kotlin" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdatePlugin" }
xemantic-conventions = { id = "com.xemantic.gradle.xemantic-conventions", version.ref = "xemanticConventionsPlugin" }
